<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | SugamArtz</title>
    <meta name="description" content="The page you requested could not be found." />
    <style>
      :root {
        --paper: #f4eee2;
        --ink: #29221d;
        --red: #a43c2f;
        --gold: #a8884c;
        --line: #d5c6b0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--paper);
        color: var(--ink);
        font-family: DM Mono, monospace;
        text-align: center;
      }
      .card {
        width: min(92vw, 540px);
        background: rgba(255,255,255,0.22);
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: 0 16px 34px rgba(41, 34, 29, 0.06);
        padding: 40px 28px;
      }
      .eyebrow {
        color: var(--red);
        letter-spacing: .2em;
        font-size: 10px;
        text-transform: uppercase;
      }
      h1 {
        margin: 18px 0 14px;
        font-family: Georgia, serif;
        font-weight: 400;
        font-size: clamp(36px, 8vw, 64px);
      }
      p {
        margin: 0;
        line-height: 1.7;
        color: rgba(41,34,29,0.8);
      }
      a {
        display: inline-block;
        margin-top: 24px;
        color: var(--red);
        text-decoration: none;
        border-bottom: 1px solid var(--red);
        padding-bottom: 5px;
        letter-spacing: .08em;
        text-transform: uppercase;
        font-size: 10px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="eyebrow">404</div>
      <h1>Page not found.</h1>
      <p>The page you requested could not be found.</p>
      <a href="/gallery">Back to gallery</a>
    </main>
  </body>
</html>
